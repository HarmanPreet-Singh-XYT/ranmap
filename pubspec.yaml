name: ranmap
description: "Ranmap — travel together, stay in sync."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Backend / auth / realtime / storage
  supabase_flutter: ^2.8.0

  # State management & routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Maps & location
  mapbox_maps_flutter: ^2.31.0
  geolocator: ^13.0.2
  url_launcher: ^6.3.1

  # Camera / photo sharing
  image_picker: ^1.1.2

  # Voice channels
  livekit_client: ^2.13.0

  # Env & utils
  flutter_dotenv: ^5.2.1
  intl: ^0.19.0
  http: ^1.2.2
  connectivity_plus: ^7.3.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/models/
