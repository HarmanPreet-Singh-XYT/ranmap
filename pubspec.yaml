name: ranmap
description: "Ranmap — travel together, stay in sync."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Backend / auth / realtime / storage
  supabase_flutter: ^2.8.0

  # State management & routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Maps & location
  mapbox_maps_flutter: ^2.31.0
  geolocator: ^13.0.2
  url_launcher: ^6.3.1

  # Camera / photo sharing
  image_picker: ^1.1.2
  # Disk-cached network images, so signed-URL photos aren't re-downloaded on
  # every screen entry (the signed URL rotates, so tiles key the cache by path).
  cached_network_image: ^3.4.1

  # Voice channels
  livekit_client: ^2.13.0

  # Env & utils
  flutter_dotenv: ^5.2.1
  intl: ^0.20.3
  http: ^1.2.2
  connectivity_plus: ^7.3.1
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0
  purchases_flutter: ^10.13.1
  forui: ^0.27.0
  flutter_animate: ^4.5.2
  multiavatar_plus: ^0.2.0+1
  flutter_svg: ^2.3.0
  package_info_plus: ^10.2.1
  app_links: ^7.2.1
  share_plus: ^13.3.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_markdown_plus: ^1.0.12
  gal: ^2.3.3
  wakelock_plus: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/models/
    - assets/images/onboarding/
    - assets/images/tour/
    - assets/images/paywall/
    - assets/images/scenic/
    - assets/images/logo/
  fonts:
    # "Convoy Clean Modern" brand typeface. Shipped as a variable font, so the
    # weight axis is selected per-style via `fontVariations` (see
    # core/theme/brand_typography.dart) rather than separate static files.
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
